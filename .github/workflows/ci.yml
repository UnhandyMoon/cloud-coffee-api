name: Integración Continua (CI)

# Configuración de detonadores (eventos)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Trabajos a ejecutar en la canalización
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # 1. Descargar el código del repositorio en el servidor de pruebas
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      # 2. Configurar el entorno de ejecución (Node.js)
      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar las dependencias del proyecto de forma limpia
      - name: Instalar dependencias
        run: npm ci

      # 4. Ejecutar la suite de pruebas unitarias automatizadas
      - name: Ejecutar pruebas unitarias
        run: npm test --if-present
